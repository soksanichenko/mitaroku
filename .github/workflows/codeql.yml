# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
# Only meaningful on a PUBLIC repo — the upload step hard-fails with "Code
# scanning is not enabled for this repository" on a private repo without
# GitHub Advanced Security (not purchased for private repos on this account).
# If the new repo will be private, delete this file rather than leave it
# permanently red.
#
name: "CodeQL Advanced"
run-name: "${{ github.event.head_commit.message || github.head_commit.message }}"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '29 21 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: python
          build-mode: none
        # If the project also has a frontend (npm/package.json), add:
        # - language: javascript-typescript
        #   build-mode: none
        # For a Go project, replace the python entry with:
        # - language: go
        #   build-mode: autobuild

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
