<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-0d8577dc-8df1-4540-b8fb-ce2cce2560e4/styles.css">
<script src="_ds/modernist-0d8577dc-8df1-4540-b8fb-ce2cce2560e4/_ds_bundle.js"></script>
<script src="mitaroku-data.js"></script>
</helmet>
<main style="max-width:960px;margin:0 auto;padding:0 16px 48px;color:var(--color-text);font-family:var(--font-body)">
  <div style="padding:22px 0 14px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px">
    <div style="display:grid;gap:4px">
      <h1 style="margin:0;font-size:clamp(28px, 6vw, 40px)">Notifications</h1>
      <span style="font-size:14px;color:var(--mt-muted)">{{ unreadText }}</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
      <label style="min-height:44px;display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
        <input type="checkbox" role="switch" checked="{{ unreadOnly }}" onChange="{{ toggleUnread }}" style="width:18px;height:18px;accent-color:var(--color-text)">Unread only
      </label>
      <button type="button" class="btn btn-secondary" disabled="{{ noneUnread }}" onClick="{{ markAll }}" style="min-height:44px;gap:8px"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><path d="M18 6 7 17l-5-5"></path><path d="m22 10-7.5 7.5L13 16"></path></svg>Mark all as read</button>
    </div>
  </div>

  <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
    <div aria-busy="true" aria-label="Loading notifications" style="display:grid;gap:12px;border-top:2px solid var(--color-divider);padding-top:20px">
      <sc-for list="{{ skel }}" as="k"><div style="display:grid;grid-template-columns:40px minmax(0, 1fr);gap:12px"><div style="height:40px;background:color-mix(in srgb, var(--color-text) 9%, transparent)"></div><div style="display:grid;gap:6px"><div style="height:14px;width:40%;background:color-mix(in srgb, var(--color-text) 9%, transparent)"></div><div style="height:12px;width:70%;background:color-mix(in srgb, var(--color-text) 9%, transparent)"></div></div></div></sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
    <div role="alert" style="display:grid;gap:10px;justify-items:start;padding:28px 0;border-top:2px solid var(--color-text)">
      <h2 style="margin:0;font-size:20px">Couldn’t load notifications</h2>
      <p style="margin:0;font-size:14px;color:var(--mt-muted)">Check your connection and try again.</p>
      <button type="button" class="btn btn-secondary" onClick="{{ retry }}" style="min-height:44px">Try again</button>
    </div>
  </sc-if>

  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid;gap:10px;justify-items:start;padding:28px 0;border-top:2px solid var(--color-text)">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <h2 style="margin:0;font-size:20px">{{ emptyTitle }}</h2>
      <p style="margin:0;font-size:14px;line-height:1.5;color:var(--mt-muted);max-width:52ch">{{ emptyText }}</p>
    </div>
  </sc-if>

  <sc-if value="{{ isLive }}" hint-placeholder-val="{{ true }}">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <section aria-labelledby="{{ g.hid }}" style="border-top:2px solid var(--color-divider);padding:14px 0 6px">
        <h2 id="{{ g.hid }}" style="font-size:16px;margin:0 0 4px">{{ g.title }}</h2>
        <ul style="list-style:none;margin:0;padding:0">
          <sc-for list="{{ g.items }}" as="n">
            <li style="border-bottom:1px solid var(--color-divider)">
              <a href="{{ n.href }}" onClick="{{ n.onOpen }}" style="display:grid;grid-template-columns:40px minmax(0, 1fr) 12px;gap:12px;align-items:start;padding:12px 4px 12px 0;color:var(--color-text);text-decoration:none;background:{{ n.bg }}" style-hover="background:color-mix(in srgb, var(--color-text) 6%, transparent);text-decoration:none;color:var(--color-text)">
                <span aria-hidden="true" style="width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--color-divider)">
                  <sc-if value="{{ n.isAired }}"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><rect width="20" height="15" x="2" y="7"></rect><polyline points="17 2 12 7 7 2"></polyline></svg></sc-if>
                  <sc-if value="{{ n.isPremiere }}"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"></path><path d="m6.2 5.3 3.1 3.9M12.4 3.4l3.1 4"></path><path d="M3 11h18v10H3Z"></path></svg></sc-if>
                  <sc-if value="{{ n.isReleased }}"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><rect width="18" height="18" x="3" y="3"></rect><path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4"></path></svg></sc-if>
                  <sc-if value="{{ n.isAnnounced }}"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><rect width="18" height="18" x="3" y="4"></rect><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"></path></svg></sc-if>
                  <sc-if value="{{ n.isChanged }}"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M21 7.5V4H3v18h5.5"></path><path d="M16 2v4M8 2v4M3 10h5"></path><circle cx="16" cy="16" r="6"></circle><path d="M16 14v2.3l1.5 1.2"></path></svg></sc-if>
                </span>
                <span style="display:grid;gap:2px;min-width:0;line-height:1.35">
                  <span style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--mt-muted)">{{ n.kind }}<sc-if value="{{ n.unread }}"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"> · unread</span></sc-if></span>
                  <span style="font-size:15px;font-weight:{{ n.weight }};color:var(--mt-link);overflow-wrap:break-word">{{ n.title }}</span>
                  <span style="font-size:14px;overflow-wrap:break-word">{{ n.text }}<sc-if value="{{ n.hasChange }}"><span style="text-decoration:line-through;color:var(--mt-muted)">{{ n.from }}</span> → <strong>{{ n.to }}</strong></sc-if></span>
                </span>
                <span style="padding-top:6px"><sc-if value="{{ n.unread }}"><span aria-hidden="true" style="display:block;width:10px;height:10px;border-radius:50%;background:var(--color-accent-700)"></span></sc-if></span>
              </a>
            </li>
          </sc-for>
        </ul>
      </section>
    </sc-for>
  </sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;viewState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { unreadOnly: false, retry: null };
  componentDidMount() { this._u = window.MT ? MT.sub(() => this.forceUpdate()) : null; if (!window.MT) this._t = setTimeout(() => this.forceUpdate(), 120); }
  componentWillUnmount() { this._u && this._u(); clearTimeout(this._t); clearTimeout(this._r); }
  componentDidUpdate(pp) { if (pp.viewState !== this.props.viewState && this.state.retry) this.setState({ retry: null }); }
  retry() { this.setState({ retry: 'loading' }); clearTimeout(this._r); this._r = setTimeout(() => this.setState({ retry: 'live' }), 700); }
  renderVals() {
    const MT = window.MT;
    if (!MT) return { isLoading: true, skel: [1, 2, 3] };
    const vs = this.state.retry || this.props.viewState || 'live';
    const all = vs === 'empty' ? [] : MT.notifications;
    const unread = all.filter(n => !MT.isRead(n)).length;
    const shown = all.filter(n => !this.state.unreadOnly || !MT.isRead(n));
    const KIND = { aired: 'Episode aired', premiere: 'New season premiere', released: 'Movie released', announced: 'Release date announced', changed: 'Release date changed' };
    const dayTitle = d => { const n = MT.daysTo(d); return n === 0 ? 'Today' : n === -1 ? 'Yesterday' : MT.dow(d) + ', ' + MT.fmt(d); };
    const days = [];
    shown.forEach(n => { if (days.indexOf(n.day) < 0) days.push(n.day); });
    const groups = days.map(d => ({
      hid: 'nd-' + d, title: dayTitle(d),
      items: shown.filter(n => n.day === d).map(n => {
        const t = MT.title(n.titleId), x = n.x, isUnread = !MT.isRead(n);
        let text = '';
        if (n.type === 'aired') text = x.code + ' · ' + x.ep;
        if (n.type === 'premiere') text = x.code + ' started with “' + x.ep + '”';
        if (n.type === 'released') text = 'Out now, ' + MT.fmt(n.day);
        if (n.type === 'announced') text = x.code + ' premieres ' + MT.fmt(x.to);
        if (n.type === 'changed') text = x.code + ': ';
        return {
          href: MT.hrefFor(t), title: t.title, kind: KIND[n.type], text,
          isAired: n.type === 'aired', isPremiere: n.type === 'premiere', isReleased: n.type === 'released', isAnnounced: n.type === 'announced', isChanged: n.type === 'changed',
          hasChange: n.type === 'changed', from: x.from ? MT.fmtShort(x.from) : '', to: x.to ? MT.fmt(x.to) : '',
          unread: isUnread, weight: isUnread ? '800' : '500',
          bg: isUnread ? 'color-mix(in srgb, var(--color-text) 4%, transparent)' : 'transparent',
          onOpen: () => MT.markRead(n.id),
        };
      }),
    }));
    const live = vs !== 'loading' && vs !== 'error';
    return {
      isLoading: vs === 'loading', isError: vs === 'error', isEmpty: live && groups.length === 0, isLive: live && groups.length > 0,
      emptyTitle: all.length && this.state.unreadOnly ? 'No unread notifications' : 'You’re all caught up',
      emptyText: all.length && this.state.unreadOnly ? 'Turn off “Unread only” to see earlier notifications.' : 'You’ll get a notification when an episode airs, a season or movie premieres, or a release date is announced or changes.',
      skel: [1, 2, 3, 4], retry: () => this.retry(), groups,
      unreadText: unread ? unread + ' unread' : 'No unread notifications',
      unreadOnly: this.state.unreadOnly, toggleUnread: () => this.setState(s => ({ unreadOnly: !s.unreadOnly })),
      noneUnread: unread === 0, markAll: () => MT.markAllRead(),
    };
  }
}
</script>
</body>
</html>
