  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"e13e9f4d-cb8e-4055-89e5-60e85243dae4\"><\u002Fscript>\n<script src=\"02b0a339-d841-4437-bc26-b03b95d9dcaa\"><\u002Fscript>\n<style>\nhtml{--mt-link:var(--color-text);--mt-muted:color-mix(in srgb,var(--color-text) 72%,transparent)}\nhtml:has([data-mt-links=\"blue\"]){--mt-link:oklch(0.46 0.11 255)}\nhtml:has([data-mt-theme=\"dark\"]){--color-bg:#1c1a19;--color-surface:#282625;--color-text:#ecebea;--color-accent:#ff563c;--color-divider:color-mix(in srgb,#ecebea 30%,transparent);color-scheme:dark}\nhtml:has([data-mt-theme=\"dark\"][data-mt-links=\"blue\"]){--mt-link:oklch(0.8 0.08 255)}\nbody{margin:0;background:var(--color-bg)}\na{color:var(--mt-link);text-decoration:none;text-underline-offset:3px}\na:hover{color:var(--mt-link);text-decoration:underline}\nbutton{font-family:inherit}\nbutton:disabled{cursor:default!important}\n[data-mt-scroller]::-webkit-scrollbar{display:none}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-mt-theme=\"{{ theme }}\" data-mt-links=\"{{ links }}\" style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);padding-bottom:{{ bottomPad }}\">\n\n<header style=\"border-bottom:2px solid var(--color-divider)\">\n  <div style=\"max-width:960px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;gap:8px\">\n    <a href=\"#/library\" aria-label=\"mitaroku, go to library\" style=\"flex:none;min-height:44px;display:flex;align-items:center;gap:8px;margin-right:12px;white-space:nowrap;color:var(--color-text);text-decoration:none\" style-hover=\"text-decoration:none;color:var(--color-text)\">\n      <span style=\"font-weight:800 :color-mix(in srgb, var(--color-text) 7%, transparent);color:var(--color-text)\">\n        <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9\"><\u002Fpath><path d=\"M10.3 21a1.94 1.94 0 0 0 3.4 0\"><\u002Fpath><\u002Fsvg>\n        <sc-if value=\"{{ hasUnread }}\" hint-placeholder-val=\"{{ true }}\"><span aria-hidden=\"true\" style=\"position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;background:var(--color-accent-700);color:var(--color-neutral-100);font-size:11px;font-weight:800;line-height:1\">{{ unread }}<\u002Fspan><\u002Fsc-if>\n      <\u002Fa>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ narrowNav }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"flex:1\"><\u002Fspan>\n      <a href=\"#/search\" aria-label=\"{{ t.search }}\" title=\"{{ t.search }}\" style=\"flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--color-text)\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"flex:1\"><\u002Fspan><\u002Fsc-if>\n    <button type=\"button\" class=\"btn btn-icon btn-secondary\" aria-label=\"{{ themeLabel }}\" title=\"{{ themeLabel }}\" sc-camel-on-click=\"{{ toggleTheme }}\" style=\"flex:none;width:44px;height:44px;min-width:44px;min-height:44px;padding:0;display:grid;place-items:center\">\n      <sc-if value=\"{{ isDark }}\" hint-placeholder-val=\"{{ false }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n      <sc-if value=\"{{ isLight }}\" hint-placeholder-val=\"{{ true }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n    <\u002Fbutton>\n    <sc-if value=\"{{ wideNav }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-mt-user=\"1\" style=\"position:relative;flex:none\">\n        <button type=\"button\" aria-haspopup=\"menu\" aria-expanded=\"{{ userExpanded }}\" aria-label=\"{{ t.account }}\" title=\"{{ t.account }}\" sc-camel-on-click=\"{{ toggleUser }}\" style=\"height:44px;display:flex;align-items:center;gap:4px;padding:0 4px;background:none;border:0;color:var(--color-text);cursor:pointer\" style-hover=\"background:color-mix(in srgb, var(--color-text) 7%, transparent)\">\n          <span aria-hidden=\"true\" style=\"width:32px;height:32px;display:grid;place-items:center;background:var(--color-text);color:var(--color-bg);font-size:12px;font-weight:800\">KM<\u002Fspan>\n          <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n        <sc-if value=\"{{ userOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div role=\"menu\" aria-label=\"{{ t.account }}\" style=\"position:absolute;right:0;top:calc(100% + 6px);z-index:60;width:240px;background:var(--color-bg);border:1px solid var(--color-text);box-shadow:var(--shadow-md);display:grid;padding:4px 0\">\n            <div style=\"padding:10px 14px;display:grid;gap:2px;border-bottom:1px solid var(--color-divider)\"><strong style=\"font-size:14px\">Kira Mori<\u002Fstrong><span style=\"font-size:12px;color:var(--mt-muted);overflow-wrap:anywhere\">kira.mori@home-portal.example<\u002Fspan><\u002Fdiv>\n            <a href=\"#/settings\" role=\"menuitem\" sc-camel-on-click=\"{{ closeUser }}\" style=\"min-height:44px;display:flex;align-items:center;padding:0 14px;font-size:14px;color:var(--color-text);text-decoration:none\" style-hover=\"background:color-mix(in srgb, var(--color-text) 7%, transparent);color:var(--color-text);text-decoration:none\">{{ t.profileSettings }}<\u002Fa>\n            <a href=\"#/import\" role=\"menuitem\" sc-camel-on-click=\"{{ closeUser }}\" style=\"min-height:44px;display:flex;align-items:center;padding:0 14px;font-size:14px;color:var(--color-text);text-decoration:none\" style-hover=\"background:color-mix(in srgb, var(--color-text) 7%, transparent);color:var(--color-text);text-decoration:none\">{{ t.importExport }}<\u002Fa>\n            <div role=\"group\" aria-label=\"{{ t.language }}\" style=\"display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)\">\n              <span style=\"flex:1;font-size:14px\">{{ t.language }}<\u002Fspan>\n              <div style=\"display:flex;border:1px solid var(--color-divider)\">\n                <sc-for list=\"{{ langs }}\" as=\"l\"><button type=\"button\" role=\"menuitemradio\" aria-checked=\"{{ l.checked }}\" lang=\"{{ l.code }}\" sc-camel-on-click=\"{{ l.onClick }}\" style=\"min-width:44px;height:36px;padding:0 8px;border:0;background:{{ l.bg }};color:{{ l.fg }};font-size:13px;font-weight:700;cursor:pointer\">{{ l.label }}<\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <a href=\"#/login\" role=\"menuitem\" sc-camel-on-click=\"{{ closeUser }}\" style=\"min-height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;color:var(--color-text);text-decoration:none\" style-hover=\"background:color-mix(in srgb, var(--color-text) 7%, transparent);color:var(--color-text);text-decoration:none\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"><\u002Fpath><polyline points=\"16 17 21 12 16 7\"><\u002Fpolyline><line x1=\"21\" x2=\"9\" y1=\"12\" y2=\"12\"><\u002Fline><\u002Fsvg>{{ t.logout }}<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<sc-if value=\"{{ r.library }}\" hint-placeholder-val=\"{{ true }}\"><dc-import name=\"Library\" theme=\"{{ theme }}\" vw=\"{{ vw }}\" view-state=\"{{ demo }}\" hint-size=\"100%,1200px\"><\u002Fdc-import><\u002Fsc-if>\n<sc-if value=\"{{ r.upcoming }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Upcoming\" theme=\"{{ theme }}\" view-state=\"{{ demo }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n<sc-if value=\"{{ r.search }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Search\" theme=\"{{ theme }}\" vw=\"{{ vw }}\" query=\"{{ query }}\" view-state=\"{{ demo }}\" hint-size=\"100%,700px\"><\u002Fdc-import><\u002Fsc-if>\n<sc-if value=\"{{ r.notifications }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Notifications\" view-state=\"{{ demo }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n<sc-if value=\"{{ r.settings }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Settings\" vw=\"{{ vw }}\" role=\"{{ role }}\" telegram-state=\"{{ tgState }}\" tg-simulate=\"{{ tgSimulate }}\" view-state=\"{{ demo }}\" hint-size=\"100%,1200px\"><\u002Fdc-import><\u002Fsc-if>\n<sc-if value=\"{{ r.importExport }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Import Export\" mode=\"{{ ieMode }}\" theme=\"{{ theme }}\" vw=\"{{ vw }}\" view-state=\"{{ demo }}\" hint-size=\"100%,1100px\"><\u002Fdc-import><\u002Fsc-if>\n<sc-if value=\"{{ r.login }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Login\" view-state=\"{{ demo }}\" hint-size=\"100%,560px\"><\u002Fdc-import><\u002Fsc-if>\n<sc-if value=\"{{ r.title }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Title Page\" screen=\"{{ titleScreen }}\" theme=\"{{ theme }}\" season-layout=\"{{ seasonLayout }}\" numbering=\"{{ numbering }}\" link-color=\"{{ links }}\" hint-size=\"100%,2400px\"><\u002Fdc-import><\u002Fsc-if>\n<sc-if value=\"{{ r.browse }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Browse\" params=\"{{ params }}\" theme=\"{{ theme }}\" vw=\"{{ vw }}\" view-state=\"{{ demo }}\" hint-size=\"100%,1400px\"><\u002Fdc-import><\u002Fsc-if>\n<sc-if value=\"{{ r.collection }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"Collection\" collection-id=\"{{ routeId }}\" theme=\"{{ theme }}\" vw=\"{{ vw }}\" view-state=\"{{ demo }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fsc-if>\n\n<aside aria-label=\"Design notes\" style=\"max-width:960px;margin:0 auto;padding:0 16px 56px\">\n  <details open=\"{{ true }}\" style=\"border:1px dashed var(--color-divider);padding:0 16px\">\n    <summary style=\"min-height:44px;display:flex;align-items:center;cursor:pointer;font-size:13px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase\">Design notes (not part of the UI)<\u002Fsummary>\n    <div style=\"display:grid;gap:14px;padding:4px 0 18px;font-size:14px;line-height:1.5;max-width:72ch\">\n      <div><strong>Navigation.<\u002Fstrong> From 720 px the header holds the logo, Library, Upcoming, the search field, the notifications bell with its unread counter, the theme toggle and the user menu (Profile &amp; settings, Import / export, EN / RU, Log out). Below 720 px the header shrinks to the logo, a search icon and the theme toggle, and a fixed 56 px bottom tab bar holds Library, Upcoming, Search, Notifications and Profile. Pages get 72 px of bottom padding so the bar never covers content. Detail, Browse and Collection pages count as Library in the navigation.<\u002Fdiv>\n      <div><strong>Screens and routes.<\u002Fstrong> Each screen is its own component under one shell, and the address is the state: <code>#/library<\u002Fcode>, <code>#/upcoming<\u002Fcode>, <code>#/search?q=<\u002Fcode>, <code>#/notifications<\u002Fcode>, <code>#/settings<\u002Fcode>, <code>#/import<\u002Fcode>, <code>#/export<\u002Fcode>, <code>#/login<\u002Fcode>, <code>#/title/show|anime|movie<\u002Fcode>, <code>#/browse?type=&amp;genre=&amp;country=&amp;year=<\u002Fcode> and <code>#/collection/&lt;id&gt;<\u002Fcode>. Each maps one-to-one to a Django view, with HTMX swaps for filters, Load more and status changes.<\u002Fdiv>\n      <div><strong>Loading, empty and error.<\u002Fstrong> Every screen has all three. Preview them with Tweaks → Demo state; “Try again” goes from error to loading to the live view. Search also has a typing hint (one character), no results (try “zzz”) and a provider error (search for “error”). Skeletons copy the final layout so nothing jumps when content arrives.<\u002Fdiv>\n      <div><strong>Shared components.<\u002Fstrong> Rating badge (source + value, tooltip “TMDB user score, out of 10”, accessible name; MAL on anime). Status picker: an ink chip with the current status, or an outlined “Add”; both open the same menu (Watching, Plan to watch, Completed, Dropped, Remove), with 44 px rows. Poster card: poster, rating badge, airing chip, title, year and the status picker; the Library variant adds the 3 px progress bar and the next air date. Round check: the same three-state control as the episode list.<\u002Fdiv>\n      <div><strong>Browse and Collections.<\u002Fstrong> Every “See also” link opens Browse with its filters already in the address, and the page title is generated from those filters (“Drama series of 2025”). Removing a chip or adding a filter rewrites the address, so Back and shared links work. Collection cards open the collection page; the counts on the cards come from the collection’s own titles, so the card and the page always agree.<\u002Fdiv>\n      <div><strong>Red on text surfaces.<\u002Fstrong> The bell counter, unread dot, TODAY tags, field errors and primary buttons (Continue, Search, Start import, Download, Sign in, Mark all as watched) all use accent-700 with light text: 6.6:1. Statuses everywhere else are ink chips, so red stays reserved for actions and new or urgent state.<\u002Fdiv>\n      <div><strong>44 px touch targets.<\u002Fstrong> Every control is at least 44 × 44 px: the header theme toggle, bell and avatar, the detail-page section tabs (Description, Cast, Episodes, Similar, More), franchise and filter chips, status pickers, check buttons and bottom tabs. Icons stay at 18–22 px inside the larger hit area, so the header is still 56 px tall. On Library and Browse cards, the poster and the title block form one link, and the title block is at least 44 px tall.<\u002Fdiv>\n      <div><strong>Telegram states.<\u002Fstrong> Not connected (Connect Telegram) → Waiting (one-time link to the bot, 10-minute countdown, Cancel) → Connected (“Connected as @kira_mori”, Disconnect with a confirmation step). Blocked: if the user blocks the bot, the block shows “Telegram notifications are off: the bot was blocked” with Reconnect, which starts a new one-time link. Preview each state with Tweaks → Telegram state; while Waiting, the Tweaks control “Simulate Start in Telegram” stands in for the bot callback and moves the block to Connected.<\u002Fdiv>\n      <div><strong>Languages.<\u002Fstrong> The EN / RU switch in the user menu and the Interface language setting share one value. In this prototype it translates the global navigation; screen copy is English placeholder. Metadata language is a separate setting and controls titles and descriptions from TMDB and MyAnimeList.<\u002Fdiv>\n      <div><strong>Prototype data.<\u002Fstrong> All screens read one in-memory store, so a status set in Search, Browse or a collection shows up in Library and Upcoming straight away. The demo date is Oct 8, 2026. Titles without their own placeholder page open the nearest of the three detail pages (show, anime or movie). The store resets on reload.<\u002Fdiv>\n      <div style=\"border-top:1px solid var(--color-divider);padding-top:12px\"><strong>Detail pages<\u002Fstrong><\u002Fdiv>\n      <div><strong>Red accent.<\u002Fstrong> Only for user actions and state: the active watch status, the Continue button, Save, the TODAY tag and focus rings. Every red surface that carries text uses the deep step <code>--color-accent-700<\u002Fcode> (#AE1800) with light text <code>--color-neutral-100<\u002Fcode> (#F8F4F4), in both themes: <strong>6.6:1<\u002Fstrong>, against the 4.5:1 target for text under 24 px. Hover and pressed states go one step deeper (accent-800 #7C1405 at 9.9:1, accent-900 at about 14:1). The brighter accent (#EC3013 light, #FF563C dark) is kept only for text-free signals such as the focus ring; it measured 3.85:1 and 2.89:1 with light text. In the dark theme the active segment also gets a bold label and a check icon (from 480 px), so the filled state does not rely on color alone. External ratings are neutral ink blocks that name their source (TMDB user score for shows and films, MAL for anime). Each title carries one field, a source name plus a value, so another source such as IMDb can be added later without changing the layout. The badge has a tooltip (“TMDB user score, out of 10”) and an accessible name. Bullets, the nav underline and rating badges are ink.<\u002Fdiv>\n      <div><strong>Imagery.<\u002Fstrong> Grayscale by default (the system’s <code>.grayscale<\u002Fcode> filter). An image switches to color (1) on hover or keyboard focus, and (2) when it is the active item: this page’s own backdrop or poster, and the selected trailer. Lists (Similar, Collections, trailer thumbnails, cast photos) stay grayscale until hovered or focused. Placeholders are tinted so you can see the switch.<\u002Fdiv>\n      <div><strong>Secondary text.<\u002Fstrong> Ink at 72% opacity, applied to labels, dates, hints and counters: about 6:1 on the light ground. The dark theme keeps the same targets: secondary text about 8:1, body text about 15:1 and blue links about 9:1 on the dark ground. Watched episode titles switch from blue to muted ink at full opacity; they are never faded.<\u002Fdiv>\n      <div><strong>Breakpoints.<\u002Fstrong> Below 480 px: no wordmark, short status labels, no check icon in the status control, and movie facts stacked. From 600 px: each episode row is one grid (number, title, date, stars, menu, check) across the full content width. The title column is capped at 420 px so the date and stars stay close to it. From 720 px: two-column hero (image left; status, rating and facts right; poster at most 240 px). Cast shows 2, 3 or 4 columns below 600 px, from 600 px and from 840 px.<\u002Fdiv>\n      <div><strong>Episodes.<\u002Fstrong> Fully watched groups start collapsed, and the group with the next episode stays open. Single-entry groups (for example one movie) render as one row with a type tag. Continuation groups show the absolute number beside the season code (for example “7 · S2E1”); Tweaks can switch to per-season only or continuous only. The number column fits 4 digits. The “Mark all up to here” hint shows once, after your first check, and stays dismissed.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdetails>\n<\u002Faside>\n\n<sc-if value=\"{{ showBottom }}\" hint-placeholder-val=\"{{ true }}\">\n  <nav aria-label=\"Main\" style=\"position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--color-bg);border-top:2px solid var(--color-divider);display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));padding-bottom:env(safe-area-inset-bottom)\">\n    <sc-for list=\"{{ tabs }}\" as=\"b\" hint-placeholder-count=\"5\">\n      <a href=\"{{ b.href }}\" aria-current=\"{{ b.current }}\" aria-label=\"{{ b.aria }}\" style=\"position:relative;min-height:56px;display:grid;justify-items:center;align-content:center;gap:3px;padding:4px 2px;margin-top:-2px;border-top:2px solid {{ b.line }};color:var(--color-text);font-size:11px;font-weight:{{ b.weight }};line-height:1.1;text-decoration:none;text-align:center;min-width:0\" style-hover=\"background:color-mix(in srgb, var(--color-text) 6%, transparent);color:var(--color-text);text-decoration:none\">\n        <span style=\"position:relative;display:grid;place-items:center\">\n          <sc-if value=\"{{ b.isLib }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><path d=\"m16 6 4 14M12 6v14M8 8v12M4 4v16\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n          <sc-if value=\"{{ b.isUp }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n          <sc-if value=\"{{ b.isSearch }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n          <sc-if value=\"{{ b.isBell }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9\"><\u002Fpath><path d=\"M10.3 21a1.94 1.94 0 0 0 3.4 0\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n          <sc-if value=\"{{ b.isUser }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><circle cx=\"12\" cy=\"8\" r=\"5\"><\u002Fcircle><path d=\"M20 21a8 8 0 0 0-16 0\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n          <sc-if value=\"{{ b.badge }}\"><span aria-hidden=\"true\" style=\"position:absolute;top:-4px;left:14px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;background:var(--color-accent-700);color:var(--color-neutral-100);font-size:10px;font-weight:800;line-height:1\">{{ unread }}<\u002Fspan><\u002Fsc-if>\n        <\u002Fspan>\n        <span style=\"max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ b.label }}<\u002Fspan>\n      <\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fnav>\n<\u002Fsc-if>\n\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;library&quot;,&quot;upcoming&quot;,&quot;search&quot;,&quot;notifications&quot;,&quot;settings&quot;,&quot;import&quot;,&quot;export&quot;,&quot;login&quot;,&quot;title-show&quot;,&quot;title-anime&quot;,&quot;title-movie&quot;,&quot;browse&quot;,&quot;collection&quot;],&quot;default&quot;:&quot;library&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Screen&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;,&quot;section&quot;:&quot;Screen&quot;},&quot;demoState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;'live'|'loading'|'empty'|'error'&quot;,&quot;section&quot;:&quot;Screen&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quo
